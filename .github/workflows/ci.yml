# Every push: all checks (make test-all). A release: push a tag v1.2.3, or on GitHub open
# Actions > ci > Run workflow and type the version; either builds the desktop app and attaches
# it to the GitHub release v1.2.3 (Linux tar.gz and .deb, Windows .zip, macOS .zip, SHA256SUMS).
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.0 (makes the tag v0.1.0)'
        required: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: python -m pip install -r requirements.txt
      - run: npm ci --no-audit --no-fund && npm install --no-save --no-audit --no-fund playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm libx11-dev
      - run: make test-all

  asm:
    # the assembler game: build both programs, test the core, play them in real windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.5.4 pytest==9.2.0
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm libx11-dev \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 wine64 xvfb xdotool imagemagick
      - run: make -C asm all
      - run: make -C asm test
      - run: make -C asm test-window
      - uses: actions/upload-artifact@v4
        with:
          name: qubit-quest-asm
          path: |
            build/qubit-quest
            build/qubit-quest.exe

  release:
    needs: [test, asm]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: version
        id: v
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          v="${INPUT:-${GITHUB_REF_NAME#v}}"
          v="${v#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: VERSION="${{ steps.v.outputs.version }}" sh tools/package.sh
      - name: the assembler game
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm libx11-dev gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          make -C asm all
          v="${{ steps.v.outputs.version }}"
          mkdir -p dist/asm-linux dist/asm-windows
          cp build/qubit-quest README.md LICENSE dist/asm-linux/
          cp build/qubit-quest.exe README.md LICENSE dist/asm-windows/
          tar -C dist/asm-linux -czf "dist/qubit-quest-asm-$v-linux-x86_64.tar.gz" .
          (cd dist/asm-windows && zip -q -r "../qubit-quest-asm-$v-windows-x86_64.zip" .)
          (cd dist && sha256sum *.tar.gz *.zip *.deb > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Qubit Quest ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/SHA256SUMS
